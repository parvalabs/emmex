<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mlex</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="drag-strip"></div>
    <button id="workspace" class="ws" title="Switch workspace">
      <span class="ws-icon">▣</span><span id="ws-name" class="ws-name">Open a folder</span><span class="ws-chev">⌄</span>
    </button>
    <div class="row">
      <button id="new-session" class="new"><span class="ico">✎</span>New session<kbd>⌘N</kbd></button>
      <button id="new-worktree" class="icon-btn" title="New session on a git worktree">⑂</button>
    </div>
    <div id="sessions" class="sessions"></div>
    <div class="foot">
      <button id="open-models" class="foot-btn">Models</button>
      <button id="open-tools" class="foot-btn">Tools</button>
      <span id="mem" class="mem"></span>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div class="title-wrap">
        <span id="title" class="title" title="Double-click to rename"></span>
        <span id="worktree" class="badge hidden"></span>
      </div>
      <div class="modes" id="modes">
        <button data-mode="chat" class="seg">Chat</button><button data-mode="code" class="seg on">Code</button>
      </div>
      <button id="perm-btn" class="chip" title="Permission level for tool calls"><span id="perm-label">Smart</span><span class="chev">⌄</span></button>
      <button id="panel-btn" class="chip" title="Activity and changes (⌘J)"><span>Activity</span><span id="panel-count" class="cnt hidden"></span></button>
      <button id="context" class="ctx hidden" title="Context used. Click to compact.">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="6" class="ring-bg"/><circle id="ring" cx="8" cy="8" r="6" class="ring-fg"/></svg>
        <span id="ctx-pct">0%</span>
      </button>
    </header>

    <div id="scroll" class="scroll">
      <div id="timeline" class="timeline"></div>
    </div>

    <div class="composer-wrap">
      <div id="suggest" class="suggest hidden"></div>
      <div id="queue" class="queue hidden"></div>
      <div id="approvals"></div>
      <div id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="How can I help?  Type / for skills and templates"></textarea>
        <div class="bar">
          <button id="model-btn" class="chip"><span id="model-label">system</span><span class="chev">⌄</span></button>
          <button id="effort-btn" class="chip"><span class="brain">◐</span><span id="effort-label">Effort</span></button>
          <span class="spacer"></span>
          <button id="stop" class="round stop hidden" title="Stop (⌘.)">■</button>
          <button id="send" class="round send" title="Send (⌘↩)" disabled>↑</button>
        </div>
      </div>
    </div>
  </main>

  <aside id="panel" class="panel hidden">
    <div class="ptabs">
      <button class="ptab on" data-tab="activity">Activity</button>
      <button class="ptab" data-tab="changes">Changes</button>
      <span class="spacer"></span>
      <button id="panel-close" class="icon-btn" title="Close">✕</button>
    </div>
    <div id="tab-activity" class="pbody">
      <div class="psec"><div class="psec-h">Running</div><div id="act-running" class="plist"></div></div>
      <div class="psec"><div class="psec-h"><button id="act-fin-toggle" class="fold">▶</button> Finished <span id="act-fin-count" class="cnt"></span></div><div id="act-finished" class="plist folded"></div></div>
    </div>
    <div id="tab-changes" class="pbody hidden">
      <div class="psec"><div class="psec-h">Edited by this session <button id="changes-refresh" class="btn small-btn">git diff</button></div><div id="chg-list" class="plist"></div></div>
      <div class="psec hidden" id="chg-git"><div class="psec-h">Workspace diff</div><pre id="chg-stat" class="stat"></pre><pre id="chg-diff" class="gitdiff"></pre></div>
    </div>
  </aside>
</div>

<div id="menu" class="menu hidden"></div>
<div id="modal" class="modal hidden"><div id="modal-card" class="modal-card"></div></div>
<script src="/static/app.js"></script>
</body>
</html>
